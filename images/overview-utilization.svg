<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470">
  <style>
    text { font-family: Inter, 'Helvetica Neue', Arial, sans-serif; }
  </style>

  <rect width="820" height="470" fill="#FFFFFF" />

  <!-- Title -->
  <text x="410" y="20" text-anchor="middle" fill="#888888" font-size="11" font-weight="600" letter-spacing="1.5">FIGURE 2</text>
  <text x="410" y="44" text-anchor="middle" fill="#1B2A4A" font-size="18" font-weight="700">Yield Distribution Model — Utilization Curve</text>
  <text x="410" y="64" text-anchor="middle" fill="#444444" font-size="13">Junior earns a share of Senior's yield as a risk premium — the share rises with utilization</text>

  <!-- Background zones -->
  <!-- Comfort zone: 0% to 90% -->
  <rect x="72" y="80" width="619.2" height="310" fill="#EEF4EE" opacity="0.4" />
  <!-- Urgent zone: 90% to 100% -->
  <rect x="691.2" y="80" width="68.8" height="310" fill="#FDF2E9" opacity="0.5" />

  <!-- Horizontal grid lines and Y-axis labels -->
  <!-- 0% -->
  <line x1="72" y1="390" x2="760" y2="390" stroke="#E8ECF0" stroke-width="1" />
  <text x="64" y="394" text-anchor="end" fill="#888888" font-size="11">0%</text>
  <!-- 10% -->
  <line x1="72" y1="328" x2="760" y2="328" stroke="#E8ECF0" stroke-width="1" />
  <text x="64" y="332" text-anchor="end" fill="#888888" font-size="11">10%</text>
  <!-- 20% -->
  <line x1="72" y1="266" x2="760" y2="266" stroke="#E8ECF0" stroke-width="1" />
  <text x="64" y="270" text-anchor="end" fill="#888888" font-size="11">20%</text>
  <!-- 30% -->
  <line x1="72" y1="204" x2="760" y2="204" stroke="#E8ECF0" stroke-width="1" />
  <text x="64" y="208" text-anchor="end" fill="#888888" font-size="11">30%</text>
  <!-- 40% -->
  <line x1="72" y1="142" x2="760" y2="142" stroke="#E8ECF0" stroke-width="1" />
  <text x="64" y="146" text-anchor="end" fill="#888888" font-size="11">40%</text>
  <!-- 50% -->
  <line x1="72" y1="80" x2="760" y2="80" stroke="#E8ECF0" stroke-width="1" />
  <text x="64" y="84" text-anchor="end" fill="#888888" font-size="11">50%</text>

  <!-- Vertical grid lines and X-axis labels -->
  <!-- 0% -->
  <line x1="72" y1="80" x2="72" y2="390" stroke="#E8ECF0" stroke-width="1" />
  <text x="72" y="408" text-anchor="middle" fill="#888888" font-size="11">0%</text>
  <!-- 20% -->
  <line x1="209.6" y1="80" x2="209.6" y2="390" stroke="#E8ECF0" stroke-width="1" />
  <text x="209.6" y="408" text-anchor="middle" fill="#888888" font-size="11">20%</text>
  <!-- 40% -->
  <line x1="347.2" y1="80" x2="347.2" y2="390" stroke="#E8ECF0" stroke-width="1" />
  <text x="347.2" y="408" text-anchor="middle" fill="#888888" font-size="11">40%</text>
  <!-- 60% -->
  <line x1="484.8" y1="80" x2="484.8" y2="390" stroke="#E8ECF0" stroke-width="1" />
  <text x="484.8" y="408" text-anchor="middle" fill="#888888" font-size="11">60%</text>
  <!-- 80% -->
  <line x1="622.4" y1="80" x2="622.4" y2="390" stroke="#E8ECF0" stroke-width="1" />
  <text x="622.4" y="408" text-anchor="middle" fill="#888888" font-size="11">80%</text>
  <!-- 100% -->
  <line x1="760" y1="80" x2="760" y2="390" stroke="#E8ECF0" stroke-width="1" />
  <text x="760" y="408" text-anchor="middle" fill="#888888" font-size="11">100%</text>

  <!-- 90% target dashed line -->
  <line x1="691.2" y1="80" x2="691.2" y2="390" stroke="#D4A017" stroke-width="1.5" stroke-dasharray="6,4" />
  <text x="691.2" y="408" text-anchor="middle" fill="#D4A017" font-size="11" font-weight="700">90%</text>
  <text x="691.2" y="72" text-anchor="middle" fill="#D4A017" font-size="11" font-weight="600">Target</text>

  <!-- Axes -->
  <line x1="72" y1="80" x2="72" y2="390" stroke="#1B2A4A" stroke-width="1.5" />
  <line x1="72" y1="390" x2="760" y2="390" stroke="#1B2A4A" stroke-width="1.5" />

  <!-- Axis labels -->
  <text x="416" y="432" text-anchor="middle" fill="#1B2A4A" font-size="13" font-weight="600">Utilization</text>
  <text x="18" y="235" text-anchor="middle" fill="#1B2A4A" font-size="13" font-weight="600" transform="rotate(-90, 18, 235)">Junior Share of Senior's Yield</text>

  <!-- The curve: 6% at 0%, 8% at 90%, 30% at 100% -->
  <!-- toY(6)=352.8, toY(8)=340.4, toY(30)=204 -->
  <path d="M 72 352.8 L 691.2 340.4 L 760 204" fill="none" stroke="#1B2A4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Endpoint at 0%: 6% -->
  <circle cx="72" cy="352.8" r="5" fill="#1B2A4A" stroke="#FFFFFF" stroke-width="2" />
  <text x="84" y="343" fill="#1B2A4A" font-size="11" font-weight="600">6%</text>

  <!-- Kink at 90%: 8% -->
  <circle cx="691.2" cy="340.4" r="5" fill="#D4A017" stroke="#FFFFFF" stroke-width="2" />
  <text x="677" y="360" text-anchor="end" fill="#D4A017" font-size="11" font-weight="600">8%</text>

  <!-- Endpoint at 100%: 30% -->
  <circle cx="760" cy="204" r="5" fill="#1B2A4A" stroke="#FFFFFF" stroke-width="2" />

  <!-- Current utilization dot at 35%, yield ~7.6% → toX(35)=312.8, toY(7.6)=342.9 -->
  <circle cx="312.8" cy="342.9" r="7" fill="#2E75B6" stroke="#FFFFFF" stroke-width="2.5" />
  <line x1="312.8" y1="353" x2="312.8" y2="390" stroke="#2E75B6" stroke-width="1" stroke-dasharray="4,3" opacity="0.5" />
  <text x="312.8" y="329" text-anchor="middle" fill="#2E75B6" font-size="11" font-weight="700">Current: 35%</text>

  <!-- Zone annotations — aligned -->
  <text x="347.2" y="106" text-anchor="middle" fill="#2A9D8F" font-size="12" font-weight="600" opacity="0.8">Junior well-supplied</text>
  <text x="347.2" y="122" text-anchor="middle" fill="#2A9D8F" font-size="11" opacity="0.7">Gentle slope — modest premium</text>

  <text x="739" y="106" text-anchor="end" fill="#C0392B" font-size="12" font-weight="600" opacity="0.8">Junior scarce</text>
  <text x="739" y="122" text-anchor="end" fill="#C0392B" font-size="11" opacity="0.7">Premium ramps</text>

  <!-- Bottom example note -->
  <rect x="72" y="444" width="688" height="22" rx="5" fill="#F7F9FC" />
  <text x="416" y="459" text-anchor="middle" fill="#1B2A4A" font-size="11" font-weight="600">
    Example: At 0% utilization, Junior receives 6% of Senior's yield. At the 90% target, 8%. At 100%, 30%.
  </text>
</svg>
